env: "local" # local, dev, prod

# Секрет для подписи JWT — ОБЯЗАТЕЛЬНОЕ поле, без него сервис не запустится.
# Сгенерировать: openssl rand -hex 32
# Можно не хранить в файле, а передать переменной окружения JWT_SECRET
# (она имеет приоритет над значением из yaml).
jwt_secret: "change-me-to-a-long-random-string"

psql_info:
  host: "localhost"
  port: "5432"
  user: "postgres"
  password: "password"
  dbname: "app"

http_server:
  addres: "localhost:8080"
  timeout: 4s
  idle_timeout: 60s
